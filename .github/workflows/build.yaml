name: Build Hermes V8 installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check source and repository hygiene
        run: |
          python -m compileall -q core packaging tools
          python tools/repo_check.py
      - name: Run shared regressions
        run: |
          python -m pip install -r core/requirements-hermes.lock httpx2==2.16.0
          python -m unittest discover -s core -p 'test_*.py' -q
      - name: Build Debian installer
        run: python packaging/build_deb.py --architecture ${{ matrix.arch }} --output dist/Hermes-$(cat VERSION)-Linux-${{ matrix.arch }}.deb
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-linux-${{ matrix.arch }}
          path: dist/Hermes-*-Linux-${{ matrix.arch }}.deb
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assemble Windows edition
        run: python tools/assemble.py windows dist/windows
      - name: Run Windows-native regressions
        run: |
          python -m pip install fastapi==0.162.0 aiohttp==3.14.5 httpx2==2.16.0 psutil pywin32 pyperclip plyer Pillow==12.0.0
          python -m unittest discover -s dist/windows -p 'test_*.py' -q
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis --yes --no-progress
      - name: Fetch signed Python bootstrap and Pillow wheel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows/build-tools | Out-Null
          Invoke-WebRequest -UseBasicParsing -Uri https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe -OutFile dist/windows/build-tools/python-3.12.10-amd64.exe
          $signature = Get-AuthenticodeSignature dist/windows/build-tools/python-3.12.10-amd64.exe
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Python Software Foundation') { throw 'Python bootstrap signature is invalid' }
          python -m pip download --no-deps --only-binary=:all: --platform win_amd64 --python-version 312 --implementation cp --abi cp312 --dest dist/windows/build-tools Pillow==12.0.0
      - name: Build native Windows installer
        run: python dist/windows/build.py
      - name: Sign Windows installer when publisher credentials are configured
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $installer = Get-ChildItem dist/windows/Hermes-*-Windows-x64-Setup.exe | Select-Object -First 1
          if ($env:WINDOWS_CERTIFICATE_BASE64) {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/hermes-signing.pfx", [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName | Select-Object -Last 1
            if (!$signtool) { throw 'signtool.exe was not found' }
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f "$env:RUNNER_TEMP/hermes-signing.pfx" /p $env:WINDOWS_CERTIFICATE_PASSWORD $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw 'Windows signing failed' }
          } else {
            Write-Host 'Publisher certificate is not configured; producing a valid unsigned installer.'
          }
          $result = Get-AuthenticodeSignature $installer.FullName
          if ($env:WINDOWS_CERTIFICATE_BASE64 -and $result.Status -ne 'Valid') { throw "Invalid installer signature: $($result.Status)" }
          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Encoding ascii dist/windows/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-windows-x64
          path: |
            dist/windows/Hermes-*-Windows-x64-Setup.exe
            dist/windows/SHA256SUMS
          if-no-files-found: error

  macos:
    name: macOS Apple Silicon installers
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Assemble macOS edition
        run: python tools/assemble.py macos dist/macos
      - name: Run macOS-native regressions
        run: |
          python -m pip install -r core/requirements-hermes.lock httpx2==2.16.0 pyobjc-framework-Cocoa pyobjc-framework-Quartz pyperclip Pillow==12.0.0
          python -m unittest discover -s dist/macos -p 'test_*.py' -q
      - name: Import Apple signing identities when configured
        env:
          MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -n "$MACOS_CERTIFICATE_BASE64" ]]; then
            KEYCHAIN="$RUNNER_TEMP/hermes-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
            printf '%s' "$MACOS_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$RUNNER_TEMP/hermes-signing.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/hermes-signing.p12" -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
            security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          else
            echo 'Apple Developer certificates are not configured; producing ad-hoc-signed app and unsigned PKG/DMG.'
          fi
      - name: Build app, PKG and DMG
        env:
          MACOS_APPLICATION_IDENTITY: ${{ secrets.MACOS_APPLICATION_IDENTITY }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        run: python dist/macos/build.py
      - name: Notarize when Apple credentials are configured
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          PKG=$(find dist/macos -maxdepth 1 -name 'Hermes-*-macOS-Apple-Silicon.pkg' -print -quit)
          DMG=$(find dist/macos -maxdepth 1 -name 'Hermes-*-macOS-Apple-Silicon.dmg' -print -quit)
          if [[ -n "$APPLE_ID" && -n "$APPLE_TEAM_ID" && -n "$APPLE_APP_PASSWORD" ]]; then
            xcrun notarytool submit "$PKG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$PKG"
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
            xcrun stapler staple "$DMG"
          else
            echo 'Notarization credentials are not configured; artifacts remain locally installable with normal Gatekeeper confirmation.'
          fi
          pkgutil --check-signature "$PKG" || true
          hdiutil verify "$DMG"
          shasum -a 256 "$PKG" "$DMG" | sed 's#  .*/#  #' > dist/macos/SHA256SUMS
      - name: Remove temporary signing keychain
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/hermes-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/hermes-signing.keychain-db" || true
          fi
          rm -f "$RUNNER_TEMP/hermes-signing.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-macos-apple-silicon
          path: |
            dist/macos/Hermes-*-macOS-Apple-Silicon.pkg
            dist/macos/Hermes-*-macOS-Apple-Silicon.dmg
            dist/macos/SHA256SUMS
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --draft --title "Hermes $GITHUB_REF_NAME" --notes "Cross-platform Hermes V8 installers. Review native test evidence, signatures and hashes before publishing."
